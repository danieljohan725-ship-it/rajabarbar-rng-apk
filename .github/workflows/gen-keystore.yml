name: Generate Keystore Once

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS and Base64
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias rajabarbar \
            -storepass "BarbarKey2026!" \
            -keypass "BarbarKey2026!" \
            -dname "CN=Rajabarbar, OU=Dev, O=BarbarHub, L=Jakarta, S=JK, C=ID"
          echo "=== COPY BASE64 BELOW ==="
          base64 -w 0 release.jks
          echo ""
          echo "=== END BASE64 ==="
